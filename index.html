<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Resilience Program (SRP) – Prototyp</title>
<style>
  /* ============================================================
     2.2 — Grundlayout, Typografie, Ampelfarben
     Reine Stil-/Layoutgrundlage. Baum (2.3) und Formular (2.1)
     sind hier nur als Platzhalterflächen markiert.
     ============================================================ */

  :root {
    /* Ampelfarben — kontrastgeprüft (WCAG AA, Text/Icon auf hellem Chip-BG) */
    --srp-grau-text: #4B5563;
    --srp-grau-bg: #F3F4F6;
    --srp-gruen-text: #1B7A3D;
    --srp-gruen-bg: #DCFCE7;
    --srp-gelb-text: #92400E;
    --srp-gelb-bg: #FEF3C7;
    --srp-rot-text: #B91C1C;
    --srp-rot-bg: #FEE2E2;

    /* Neutrale Basisfarben */
    --srp-bg: #FFFFFF;
    --srp-bg-alt: #F9FAFB;
    --srp-text: #111827;
    --srp-text-muted: #6B7280;
    --srp-border: #E5E7EB;
    --srp-border-strong: #D1D5DB;
    --srp-akzent: #1D4ED8;

    --srp-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--srp-font);
    color: var(--srp-text);
    background: var(--srp-bg-alt);
  }

  header.srp-header {
    background: var(--srp-bg);
    border-bottom: 1px solid var(--srp-border);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem 0.75rem;
  }

  header.srp-header h1 {
    font-size: 1.1rem;
    margin: 0;
  }

  header.srp-header .srp-subtitle {
    color: var(--srp-text-muted);
    font-size: 0.85rem;
  }

  /* ---- Grundlayout: Baum links, Formular-Panel rechts ---- */

  .srp-layout {
    display: grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap: 1px;
    min-height: calc(100vh - 52px);
    background: var(--srp-border);
  }

  /* Breakpoint fuer "schmales Fenster" — identischer Wert wie unten in
     srpSchmalMql (JS), an dieser einen Stelle dokumentiert und bewusst
     nicht dupliziert begruendet. */
  @media (max-width: 760px) {
    .srp-layout {
      grid-template-columns: 1fr;
    }

    /* Nur wenn tatsaechlich ein Knoten ausgewaehlt ist (Klasse wird per JS
       gesetzt), wird das Formular-Panel zum Vollbild-Overlay ueber dem
       Baum. Ohne Auswahl bleibt es ein normaler gestapelter Block mit dem
       Leerzustand-Hinweistext. */
    #srp-formular-panel.srp-panel--overlay-aktiv {
      position: fixed;
      inset: 0;
      z-index: 30;
      overflow: auto;
    }
  }

  .srp-panel {
    background: var(--srp-bg);
    padding: 1rem 1.25rem;
    overflow: auto;
  }

  .srp-panel h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--srp-text-muted);
    margin: 0 0 0.75rem 0;
  }

  .srp-platzhalter {
    border: 1px dashed var(--srp-border-strong);
    border-radius: 6px;
    padding: 1rem;
    color: var(--srp-text-muted);
    font-size: 0.85rem;
  }

  /* ---- Typografie-Skala für die 5 Ebenen (Vorschau, Baum folgt in 2.3) ---- */

  .srp-ebenen-vorschau .srp-ebene {
    border-left: 2px solid var(--srp-border);
    margin-left: 0.4rem;
    padding-left: 0.75rem;
  }

  .srp-e1 { font-size: 1rem;    font-weight: 700; margin: 0.6rem 0; color: var(--srp-text); }
  .srp-e2 { font-size: 0.92rem; font-weight: 600; margin: 0.5rem 0; color: var(--srp-text); }
  .srp-e3 { font-size: 0.86rem; font-weight: 500; margin: 0.4rem 0; color: var(--srp-text); }
  .srp-e4 { font-size: 0.8rem;  font-weight: 400; margin: 0.35rem 0; color: var(--srp-text); }
  .srp-e5 { font-size: 0.75rem; font-weight: 400; margin: 0.3rem 0; color: var(--srp-text); }

  /* ---- Ampel-Chips: Farbe + Symbol (nicht nur Farbe) ---- */

  .srp-ampel {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.6;
  }

  .srp-ampel .srp-ampel-symbol {
    font-weight: 700;
  }

  .srp-ampel--grau  { color: var(--srp-grau-text);  background: var(--srp-grau-bg); }
  .srp-ampel--gruen { color: var(--srp-gruen-text); background: var(--srp-gruen-bg); }
  .srp-ampel--gelb  { color: var(--srp-gelb-text);  background: var(--srp-gelb-bg); }
  .srp-ampel--rot   { color: var(--srp-rot-text);   background: var(--srp-rot-bg); }

  .srp-legende-liste {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .srp-legende-zeile {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.85rem;
  }

  .srp-legende-zeile .srp-legende-erklaerung {
    color: var(--srp-text-muted);
  }

  /* ---- 2.3: Baumdarstellung (auf-/zuklappbar) ---- */

  .srp-baum-liste {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  ul.srp-kinder.srp-baum-liste {
    margin-left: 0.5rem;
    padding-left: 0.75rem;
    border-left: 1px solid var(--srp-border);
  }

  ul.srp-kinder.srp-baum-liste[hidden] {
    display: none;
  }

  .srp-knoten-zeile {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 0.35rem;
    padding: 0.25rem 0.3rem;
    border-radius: 4px;
    cursor: pointer;
  }

  .srp-toggle,
  .srp-toggle-platzhalter {
    margin-top: 0.15rem;
  }

  .srp-knoten-zeile:hover {
    background: var(--srp-bg-alt);
  }

  .srp-knoten-zeile.srp-ausgewaehlt {
    background: #EFF6FF;
    outline: 1px solid var(--srp-akzent);
    outline-offset: -1px;
  }

  .srp-toggle,
  .srp-toggle-platzhalter {
    width: 1rem;
    flex: 0 0 auto;
    text-align: center;
  }

  .srp-toggle {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--srp-text-muted);
    font-size: 0.7rem;
    padding: 0;
    line-height: 1.4;
  }

  /* Farbe bewusst einheitlich (--srp-text) ueber alle Ebenen: die Bewertung
     haengt am tiefsten befuellten Punkt, Ebene 4/5 sind also inhaltlich
     nicht "unwichtiger" als Ebene 1/2. Hierarchie kommt allein aus
     Einrueckung, Schriftgroesse und -staerke. */
  .srp-knoten-label.srp-knoten-e1 { font-size: 1rem;    font-weight: 700; color: var(--srp-text); }
  .srp-knoten-label.srp-knoten-e2 { font-size: 0.92rem; font-weight: 600; color: var(--srp-text); }
  .srp-knoten-label.srp-knoten-e3 { font-size: 0.86rem; font-weight: 500; color: var(--srp-text); }
  .srp-knoten-label.srp-knoten-e4 { font-size: 0.8rem;  font-weight: 400; color: var(--srp-text); }
  .srp-knoten-label.srp-knoten-e5 { font-size: 0.75rem; font-weight: 400; color: var(--srp-text); }

  /* Name bekommt den verbleibenden Platz und darf umbrechen; die
     Status-Gruppe rechts bleibt einzeilig und wird nicht kleiner. */
  .srp-knoten-label {
    flex: 1 1 auto;
    min-width: 8em;
    overflow-wrap: break-word;
    padding-top: 0.1rem;
  }

  .srp-knoten-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-left: auto;
    padding-left: 0.5rem;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  /* ---- 2.5: Verdichtung — Ring-Chip fuer Elternknoten, optisch
     unterscheidbar vom gefuellten Chip des eigenen Blatt-Status ---- */

  .srp-ampel--verdichtet {
    background: transparent;
    border: 1.5px solid currentColor;
    padding: 0.1rem 0.5rem;
  }

  .srp-zaehler {
    font-size: 0.7rem;
    color: var(--srp-text-muted);
  }

  .srp-abdeckung {
    font-size: 0.7rem;
    color: var(--srp-text-muted);
    font-style: italic;
  }

  /* ---- 2.1: Klickmodell / Formular-Panel ---- */

  .srp-formular-kopf {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    padding-bottom: 0.75rem;
    margin-bottom: 0.75rem;
    border-bottom: 1px solid var(--srp-border);
  }

  .srp-formular-name {
    font-size: 1.05rem;
    font-weight: 700;
  }

  .srp-formular-ebene {
    font-size: 0.78rem;
    color: var(--srp-text-muted);
    margin-top: 0.15rem;
  }

  .srp-formular-schliessen {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--srp-border-strong);
    border-radius: 6px;
    width: 1.75rem;
    height: 1.75rem;
    line-height: 1;
    font-size: 1rem;
    color: var(--srp-text-muted);
    cursor: pointer;
  }

  .srp-formular-schliessen:hover {
    background: var(--srp-bg-alt);
  }

  .srp-baustein3-hinweis {
    background: var(--srp-bg-alt);
    border: 1px solid var(--srp-border);
    border-radius: 6px;
    padding: 0.6rem 0.75rem;
    font-size: 0.78rem;
    color: var(--srp-text-muted);
    margin-bottom: 1rem;
  }

  .srp-feld {
    margin-bottom: 0.9rem;
  }

  .srp-feld label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }

  .srp-feld select,
  .srp-feld textarea,
  .srp-feld input.srp-datum-feld {
    width: 100%;
    font: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--srp-border-strong);
    border-radius: 6px;
    background: var(--srp-bg);
    color: var(--srp-text);
  }

  .srp-feld textarea {
    resize: vertical;
    min-height: 4.5rem;
  }

  .srp-feld-inline {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .srp-feld-inline input[type="checkbox"] {
    width: auto;
  }

  .srp-speichern-btn {
    font: inherit;
    font-size: 0.82rem;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    border: 1px solid var(--srp-border-strong);
    background: var(--srp-bg-alt);
    color: var(--srp-text-muted);
    cursor: not-allowed;
  }

  .srp-uebersicht-zeile {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--srp-border);
    font-size: 0.85rem;
  }

  .srp-uebersicht-zeile:last-child {
    border-bottom: none;
  }

  .srp-uebersicht-name {
    flex: 1 1 auto;
    min-width: 0;
  }

  details.srp-stilguide {
    background: var(--srp-bg);
    border-top: 1px solid var(--srp-border);
  }

  details.srp-stilguide summary {
    cursor: pointer;
    padding: 0.75rem 1.25rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--srp-text-muted);
    list-style: none;
  }

  details.srp-stilguide summary::-webkit-details-marker {
    display: none;
  }

  details.srp-stilguide summary::before {
    content: "▸ ";
  }

  details.srp-stilguide[open] summary::before {
    content: "▾ ";
  }

  details.srp-stilguide summary .srp-stilguide-hinweis {
    font-weight: 400;
    font-style: italic;
  }

  details.srp-stilguide .srp-stilguide-inhalt {
    padding: 0 1.25rem 1.25rem 1.25rem;
  }

  details.srp-stilguide h2 {
    font-size: 0.9rem;
    margin: 0 0 0.75rem 0;
  }

  .srp-stilguide-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  /* ---- Sichtbare Kurz-Legende: gefuellt vs. Ring (nicht im Stilguide,
     da Nutzer den Unterschied sonst nicht von selbst verstehen) ---- */

  .srp-chip-legende {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    padding: 0.5rem 0.6rem;
    margin-bottom: 0.75rem;
    background: var(--srp-bg-alt);
    border: 1px solid var(--srp-border);
    border-radius: 6px;
    font-size: 0.72rem;
    color: var(--srp-text-muted);
  }

  .srp-chip-legende-zeile {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.25rem;
  }

  .srp-chip-legende-zeile + .srp-chip-legende-zeile {
    padding-top: 0.4rem;
    border-top: 1px solid var(--srp-border);
  }

  .srp-chip-legende-eintrag {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    white-space: nowrap;
  }

  /* ---- 2.4: Suche ---- */

  .srp-suche-zeile {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.6rem;
  }

  .srp-suchfeld {
    flex: 1 1 auto;
    min-width: 0;
    font: inherit;
    font-size: 0.85rem;
    padding: 0.4rem 0.6rem;
    border: 1px solid var(--srp-border-strong);
    border-radius: 6px;
  }

  .srp-such-status {
    font-size: 0.75rem;
    color: var(--srp-text-muted);
    white-space: nowrap;
  }

  .srp-zuruecksetzen-btn {
    font: inherit;
    font-size: 0.75rem;
    padding: 0.35rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--srp-border-strong);
    background: var(--srp-bg-alt);
    color: var(--srp-text);
    cursor: pointer;
    white-space: nowrap;
  }

  .srp-zuruecksetzen-btn:hover {
    background: var(--srp-border);
  }

  /* Hervorhebung eines Suchtreffers im Knotennamen */
  .srp-knoten-label--treffer {
    background: #FEF9C3;
    border-radius: 3px;
    padding: 0 0.2rem;
  }

  /* ---- 2.4: Statusfilter ---- */

  .srp-filter-zeile {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
  }

  .srp-filter-label {
    font-size: 0.75rem;
    color: var(--srp-text-muted);
    margin-right: 0.2rem;
  }

  .srp-filter-chip {
    font: inherit;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    cursor: pointer;
    background: transparent;
  }

  .srp-filter-chip[data-status="grau"]  { border: 1.5px solid var(--srp-grau-text);  color: var(--srp-grau-text); }
  .srp-filter-chip[data-status="gruen"] { border: 1.5px solid var(--srp-gruen-text); color: var(--srp-gruen-text); }
  .srp-filter-chip[data-status="gelb"]  { border: 1.5px solid var(--srp-gelb-text);  color: var(--srp-gelb-text); }
  .srp-filter-chip[data-status="rot"]   { border: 1.5px solid var(--srp-rot-text);   color: var(--srp-rot-text); }

  /* Deutlich sichtbarer aktiver Zustand: voll gefuellt statt nur heller
     Hintergrund, sonst faellt kaum auf, dass ueberhaupt gefiltert wird. */
  .srp-filter-chip--aktiv[data-status="grau"]  { background: var(--srp-grau-text);  color: #fff; }
  .srp-filter-chip--aktiv[data-status="gruen"] { background: var(--srp-gruen-text); color: #fff; }
  .srp-filter-chip--aktiv[data-status="gelb"]  { background: var(--srp-gelb-text);  color: #fff; }
  .srp-filter-chip--aktiv[data-status="rot"]   { background: var(--srp-rot-text);   color: #fff; }

  /* Kontext-Knoten bei aktivem Filter: sichtbar, aber ausgegraut */
  .srp-knoten-zeile.srp-ausgegraut {
    opacity: 0.4;
  }

  /* ---- 2.4: Pfadanzeige (Breadcrumb im Panel-Kopf) ---- */

  .srp-breadcrumb {
    font-size: 0.75rem;
    color: var(--srp-text-muted);
    margin-bottom: 0.3rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem;
  }

  .srp-breadcrumb-link {
    font: inherit;
    font-size: inherit;
    color: var(--srp-akzent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }

  .srp-breadcrumb-aktuell {
    color: var(--srp-text-muted);
  }

  .srp-breadcrumb-trenner {
    color: var(--srp-border-strong);
  }

  /* ---- 2.4: Kritische Eintraege in der Eltern-Uebersicht ---- */

  .srp-uebersicht-zeile--klickbar {
    cursor: pointer;
  }

  .srp-uebersicht-zeile--klickbar:hover {
    background: var(--srp-bg-alt);
  }

  .srp-uebersicht-pfad {
    font-size: 0.72rem;
    color: var(--srp-text-muted);
    margin-top: 0.1rem;
  }

  /* ---- Kopfzeile: Badge, Rollen-Auswahl, Kopf-Buttons ---- */

  .badge-vorbereitung {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--srp-text-muted);
    background: var(--srp-bg-alt);
    border: 1px solid var(--srp-border);
    border-radius: 999px;
    padding: 0.15rem 0.6rem;
  }

  .srp-header-spacer {
    flex: 1 1 auto;
  }

  .srp-rollen-leiste {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    font-size: 0.82rem;
  }

  .srp-rollen-leiste label {
    font-weight: 600;
    margin-right: 0.25rem;
  }

  .srp-rollen-leiste select {
    font: inherit;
    font-size: 0.82rem;
    padding: 0.3rem 0.5rem;
    border: 1px solid var(--srp-border-strong);
    border-radius: 6px;
    background: var(--srp-bg);
    color: var(--srp-text);
  }

  .srp-kopf-btn {
    font: inherit;
    font-size: 0.78rem;
    padding: 0.35rem 0.65rem;
    border-radius: 6px;
    border: 1px solid var(--srp-border-strong);
    background: var(--srp-bg);
    color: var(--srp-text);
    cursor: pointer;
  }

  .srp-kopf-btn:hover {
    background: var(--srp-bg-alt);
  }

  .srp-footer {
    text-align: center;
    padding: 0.75rem;
    font-size: 0.75rem;
    color: var(--srp-text-muted);
  }

  /* ---- Szenario-Banner & Kurzeinstieg (AP5) ---- */

  #srp-szenario-banner-slot,
  #srp-kurzeinstieg-slot {
    padding: 0.75rem 1.25rem 0;
  }

  .srp-banner {
    position: relative;
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    border-radius: 8px;
    padding: 0.9rem 2.25rem 0.9rem 1rem;
  }

  .srp-banner-schliessen {
    position: absolute;
    top: 0.5rem;
    right: 0.6rem;
    background: none;
    border: none;
    font-size: 1.1rem;
    line-height: 1;
    color: var(--srp-text-muted);
    cursor: pointer;
  }

  .srp-kurzeinstieg {
    background: var(--srp-bg);
    border: 1px solid var(--srp-border);
    border-left: 3px solid var(--srp-gruen-text);
    border-radius: 8px;
    padding: 1rem 1.25rem;
  }

  .srp-kurzeinstieg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0.9rem;
  }

  .srp-kurzeinstieg-schritt {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
  }

  .srp-kurzeinstieg-num {
    flex: 0 0 auto;
    width: 1.5rem;
    height: 1.5rem;
    border-radius: 50%;
    background: var(--srp-gruen-bg);
    color: var(--srp-gruen-text);
    font-weight: 700;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Modal (Szenario &amp; Ampel-Skala) ---- */

  .srp-modal-hintergrund {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.45);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5vh 1rem;
    z-index: 50;
    overflow: auto;
  }

  .srp-modal {
    background: var(--srp-bg);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    max-width: 620px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
  }

<script>
  /* ============================================================
     2.1 — Klickmodell / Formular-Panel
     2.3 — Baumdarstellung (auf-/zuklappbar, Ebenen unterscheidbar)
     2.4 — Pfadanzeige und Suche (inkl. Statusfilter)
     2.5 — Ampelstatus im Baum + Verdichtung nach oben
     Greift ausschliesslich ueber holeBaumDaten() auf die Daten zu.
     ============================================================ */

  // ============================================================
  // Datenhaltung: laedt/speichert den Baum in localStorage, Fallback
  // auf SRP_SEED_DATEN (Baustein 1). Tiefe Kopie beim Laden/Zuruecksetzen,
  // damit SRP_SEED_DATEN selbst nie veraendert wird.
  // ============================================================
  const SRP_STORAGE_KEY = "srp_prototype_daten_v1";
  let srpAktuelleDaten = null;

  function srpTiefeKopie(objekt) {
    return JSON.parse(JSON.stringify(objekt));
  }

  function holeBaumDaten() {
    return srpAktuelleDaten;
  }

  function srpDatenLaden() {
    try {
      const roh = localStorage.getItem(SRP_STORAGE_KEY);
      if (roh) { srpAktuelleDaten = JSON.parse(roh); return; }
    } catch (e) { /* localStorage nicht verfuegbar, Fallback auf Seed-Daten */ }
    srpAktuelleDaten = srpTiefeKopie(SRP_SEED_DATEN);
  }

  function srpDatenSpeichern() {
    try { localStorage.setItem(SRP_STORAGE_KEY, JSON.stringify(srpAktuelleDaten)); }
    catch (e) { /* localStorage nicht verfuegbar */ }
  }

  function srpDemoZuruecksetzen() {
    srpAktuelleDaten = srpTiefeKopie(SRP_SEED_DATEN);
    srpAufgeklappt.clear();
    srpDefaultZustandSetzen(holeBaumDaten());
    srpAusgewaehlteId = null;
    srpDatenSpeichern();
    srpBaumRendern();
  }

  // ============================================================
  // Rolle (Nutzer/Entwickler/Admin) — kein produktionsreifes
  // Rechtesystem (Vorbereitungsphase laut CLAUDE.md), nur UI-Steuerung.
  // ============================================================
  let srpRolle = "nutzer";
  let srpAdminFachbereich = "alle";
  let srpAdminTab = "struktur";

  // Menge der IDs, deren Kinder-Liste manuell aufgeklappt wurde.
  // Default: Ebene 1 und 2 offen, alles ab Ebene 3 zu. Wird durch Suche/
  // Filter NICHT veraendert (siehe srpIstEffektivOffen) — nur echte
  // Klicks auf den Auf-/Zuklapp-Pfeil aendern diese Menge.
  const srpAufgeklappt = new Set();

  function srpDefaultZustandSetzen(knoten) {
    if (knoten.ebene && knoten.ebene <= 2 && knoten.kinder && knoten.kinder.length > 0) {
      srpAufgeklappt.add(knoten.id);
    }
    (knoten.kinder || []).forEach(srpDefaultZustandSetzen);
  }

  // ---- Strukturkarten (einmalig aufgebaut, aendern sich nicht durch
  // Interaktion): Knoten selbst, und sein vollstaendiger Pfad ab Kategorie. ----

  const srpKnotenKarte = new Map();
  const srpPfadKarte = new Map();

  function srpKnotenKarteBauen(knoten, vorfahren) {
    const pfad = vorfahren.concat([knoten]);
    srpKnotenKarte.set(knoten.id, knoten);
    srpPfadKarte.set(knoten.id, pfad);
    (knoten.kinder || []).forEach((kind) => srpKnotenKarteBauen(kind, pfad));
  }

  // Wandelt ein ISO-Datum ("YYYY-MM-DD") in deutsche Anzeige ("TT.MM.JJJJ").
  function srpDatumDeutsch(isoDatum) {
    if (!isoDatum) return "";
    const teile = isoDatum.split("-");
    if (teile.length !== 3) return isoDatum;
    const [jahr, monat, tag] = teile;
    return tag + "." + monat + "." + jahr;
  }

  const SRP_EBENEN_NAME = {
    1: "Kategorie",
    2: "Unterkategorie",
    3: "Themenbereich",
    4: "Komponente",
    5: "Sub-Komponente",
  };

  // ---- 2.5: Verdichtung "schlechtester Wert gewinnt" (Rot > Gelb > Gruen) ----

  const SRP_PRIORITAET = { rot: 3, gelb: 2, gruen: 1 };
  const SRP_SYMBOL = { grau: "–", gruen: "✓", gelb: "!", rot: "✕" };
  const SRP_LABEL = {
    grau: "Grau – nicht bewertet",
    gruen: "Grün – kein Risiko",
    gelb: "Gelb – tolerierbares Risiko",
    rot: "Rot – inakzeptables Risiko",
  };

  // Statistik pro Knoten wird einmal vorab berechnet (Map von id -> Statistik),
  // damit beim Rendern nicht pro Knoten der ganze Teilbaum neu durchlaufen wird.
  const srpStatistikKarte = new Map();

  function srpStatistikBerechnen(knoten) {
    const zaehler = { rot: 0, gelb: 0, gruen: 0 };
    let bewertetAnzahl = 0;
    let gesamtAnzahl = 1;
    let bester = null;

    if (knoten.eintrag && knoten.eintrag.risiko) {
      zaehler[knoten.eintrag.risiko] = (zaehler[knoten.eintrag.risiko] || 0) + 1;
      bewertetAnzahl += 1;
      bester = knoten.eintrag.risiko;
    }

    (knoten.kinder || []).forEach((kind) => {
      const kindStat = srpStatistikBerechnen(kind);
      zaehler.rot += kindStat.zaehler.rot;
      zaehler.gelb += kindStat.zaehler.gelb;
      zaehler.gruen += kindStat.zaehler.gruen;
      bewertetAnzahl += kindStat.bewertetAnzahl;
      gesamtAnzahl += kindStat.gesamtAnzahl;
      if (kindStat.effektiverStatus && (!bester || SRP_PRIORITAET[kindStat.effektiverStatus] > SRP_PRIORITAET[bester])) {
        bester = kindStat.effektiverStatus;
      }
    });

    const ergebnis = { effektiverStatus: bester, zaehler, bewertetAnzahl, gesamtAnzahl };
    srpStatistikKarte.set(knoten.id, ergebnis);
    return ergebnis;
  }

  function srpZaehlerText(zaehler) {
    const teile = [];
    if (zaehler.rot > 0) teile.push(zaehler.rot + " rot");
    if (zaehler.gelb > 0) teile.push(zaehler.gelb + " gelb");
    if (zaehler.gruen > 0) teile.push(zaehler.gruen + " grün");
    return teile.join(", ");
  }

  // Blattknoten: gefuellter Chip mit dem EIGENEN bewerteten Status.
  // Elternknoten: Ring-Chip (verdichtet) + Zaehler, optisch bewusst anders
  // als der gefuellte Blatt-Chip, plus bei Kategorien (Ebene 1) sichtbar
  // der Abdeckungsgrad ("X von Y bewertet"); auf tieferen Ebenen steht der
  // Abdeckungsgrad als Tooltip am Ring-Chip, um die Zeile nicht zu ueberladen.
  function srpStatusGruppeBauen(knoten, hatKinder) {
    const gruppe = document.createElement("span");
    gruppe.className = "srp-knoten-status";

    if (!hatKinder) {
      const risiko = knoten.eintrag && knoten.eintrag.risiko ? knoten.eintrag.risiko : "grau";
      const chip = document.createElement("span");
      chip.className = "srp-ampel srp-ampel--" + risiko;
      chip.title = SRP_LABEL[risiko] + (knoten.eintrag && knoten.eintrag.begruendung ? ". " + knoten.eintrag.begruendung : "");
      chip.innerHTML = '<span class="srp-ampel-symbol">' + SRP_SYMBOL[risiko] + "</span>";
      gruppe.appendChild(chip);
      return gruppe;
    }

    const stat = srpStatistikKarte.get(knoten.id);
    const effektiv = stat.effektiverStatus || "grau";
    const abdeckungText = stat.bewertetAnzahl + " von " + stat.gesamtAnzahl + " bewertet";

    const chip = document.createElement("span");
    chip.className = "srp-ampel srp-ampel--verdichtet srp-ampel--" + effektiv;
    chip.title =
      "Verdichtet — schlechtester Status der untergeordneten Einträge. " +
      SRP_LABEL[effektiv] + ". " + abdeckungText + ".";
    chip.innerHTML = '<span class="srp-ampel-symbol">' + SRP_SYMBOL[effektiv] + "</span>";
    gruppe.appendChild(chip);

    const zaehlerText = srpZaehlerText(stat.zaehler);
    if (zaehlerText) {
      const zaehlerEl = document.createElement("span");
      zaehlerEl.className = "srp-zaehler";
      zaehlerEl.textContent = zaehlerText;
      gruppe.appendChild(zaehlerEl);
    }

    if (knoten.ebene === 1) {
      const abdeckungEl = document.createElement("span");
      abdeckungEl.className = "srp-abdeckung";
      abdeckungEl.textContent = abdeckungText;
      gruppe.appendChild(abdeckungEl);
    }

    return gruppe;
  }

  function srpGefuellterChipBauen(risiko) {
    const chip = document.createElement("span");
    chip.className = "srp-ampel srp-ampel--" + risiko;
    chip.innerHTML = '<span class="srp-ampel-symbol">' + SRP_SYMBOL[risiko] + "</span>";
    return chip;
  }

  // ============================================================
  // 2.4 — Suche und Statusfilter
  // ============================================================

  let srpSuchbegriff = "";
  const srpAktiveFilter = new Set(); // Teilmenge von {"rot","gelb","gruen","grau"}
  const srpSichtbarkeitsKarte = new Map(); // id -> enthaelt Teilbaum (inkl. sich selbst) einen Treffer?
  let srpTrefferAnzahl = 0;

  function srpSuchNorm() {
    return srpSuchbegriff.trim().toLowerCase();
  }

  function srpIstSuchOderFilterAktiv() {
    return srpSuchNorm() !== "" || srpAktiveFilter.size > 0;
  }

  // Freitext ueber Knotennamen UND Pfad (der Pfadtext enthaelt den eigenen
  // Namen als letztes Element ohnehin mit).
  function srpKnotenMatchtSuche(knoten) {
    const norm = srpSuchNorm();
    if (!norm) return true;
    const pfad = srpPfadKarte.get(knoten.id) || [knoten];
    const pfadText = pfad.map((k) => k.name).join(" › ").toLowerCase();
    return pfadText.includes(norm);
  }

  // "Eigene Bewertung" fuer den Statusfilter: eigener Risikowert, falls
  // vorhanden; bei einem Blatt ohne Bewertung zaehlt "grau" als echter
  // unbewerteter Eintrag; eine reine Struktur-Kategorie ohne eigene
  // Bewertung ist dagegen nicht filterbar (null) — sie ist kein "Eintrag".
  function srpEigenerFilterStatus(knoten) {
    if (knoten.eintrag && knoten.eintrag.risiko) return knoten.eintrag.risiko;
    const hatKinder = knoten.kinder && knoten.kinder.length > 0;
    return hatKinder ? null : "grau";
  }

  function srpKnotenMatchtFilter(knoten) {
    if (srpAktiveFilter.size === 0) return true;
    const status = srpEigenerFilterStatus(knoten);
    return status !== null && srpAktiveFilter.has(status);
  }

  // Kombiniert (UND): ein Knoten ist nur dann "Treffer", wenn er sowohl
  // die Suche als auch (falls aktiv) den Statusfilter selbst erfuellt.
  function srpIstTreffer(knoten) {
    return srpKnotenMatchtSuche(knoten) && srpKnotenMatchtFilter(knoten);
  }

  function srpSichtbarkeitBerechnen() {
    srpSichtbarkeitsKarte.clear();
    srpTrefferAnzahl = 0;
    function rekursiv(knoten) {
      const eigenerTreffer = srpIstTreffer(knoten);
      if (eigenerTreffer) srpTrefferAnzahl += 1;
      let sichtbar = eigenerTreffer;
      (knoten.kinder || []).forEach((kind) => {
        if (rekursiv(kind)) sichtbar = true;
      });
      srpSichtbarkeitsKarte.set(knoten.id, sichtbar);
      return sichtbar;
    }
    holeBaumDaten().kinder.forEach(rekursiv);
  }

  function srpKeineTrefferBauen() {
    const suchAktiv = srpSuchNorm() !== "";
    const filterAktiv = srpAktiveFilter.size > 0;
    const hinweis = document.createElement("div");
    hinweis.className = "srp-platzhalter";
    if (suchAktiv && filterAktiv) {
      hinweis.textContent = "Keine Treffer für „" + srpSuchbegriff.trim() + "“ mit den gewählten Filtern.";
    } else if (suchAktiv) {
      hinweis.textContent = "Keine Treffer für „" + srpSuchbegriff.trim() + "“.";
    } else {
      hinweis.textContent = "Keine Einträge für die gewählten Filter.";
    }
    return hinweis;
  }

  function srpSucheUiAktualisieren() {
    const suchAktiv = srpSuchNorm() !== "";

    const statusEl = document.getElementById("srp-such-status");
    statusEl.textContent = suchAktiv ? srpTrefferAnzahl + " Treffer" : "";

    const resetBtn = document.getElementById("srp-suche-zuruecksetzen");
    resetBtn.hidden = !suchAktiv;

    document.querySelectorAll(".srp-filter-chip").forEach((chip) => {
      chip.classList.toggle("srp-filter-chip--aktiv", srpAktiveFilter.has(chip.dataset.status));
    });

    const filterResetBtn = document.getElementById("srp-filter-zuruecksetzen");
    filterResetBtn.hidden = srpAktiveFilter.size === 0;
  }

  // ============================================================
  // 2.1 — Klickmodell / Formular-Panel
  // ============================================================

  // Breakpoint "schmales Fenster": identischer Wert wie die CSS-Media-Query
  // oben (max-width: 760px) — dieselbe Schwelle steuert dort das Grundlayout
  // und hier, ob das Panel bei aktiver Auswahl als Overlay dargestellt wird.
  const srpSchmalMql = window.matchMedia("(max-width: 760px)");
  let srpAusgewaehlteId = null;

  function srpUeberlagerungAktualisieren() {
    const panel = document.getElementById("srp-formular-panel");
    const alsOverlay = srpSchmalMql.matches && srpAusgewaehlteId;
    panel.classList.toggle("srp-panel--overlay-aktiv", Boolean(alsOverlay));
  }
  srpSchmalMql.addEventListener("change", srpUeberlagerungAktualisieren);

  // Aktionsleiste im Formular-Kopf: "+ Neues Item" (Ebene 2-4, jede Rolle
  // laut CLAUDE.md B2 fuer Nutzer vorgesehen), "+ Neue Unterkategorie"
  // (nur Entwickler, nur Ebene 1), Umbenennen/Loeschen (nur Entwickler,
  // ab Ebene 2).
  function srpAktionsleisteBauen(knoten) {
    const leiste = document.createElement("div");
    leiste.className = "srp-aktionsleiste";

    if (knoten.ebene >= 2 && knoten.ebene < 5) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "srp-aktion-btn";
      btn.textContent = "+ Neues Item (Ebene " + (knoten.ebene + 1) + ")";
      btn.addEventListener("click", () => srpNeuesItemAnlegen(knoten));
      leiste.appendChild(btn);
    }

    if (srpRolle === "entwickler") {
      if (knoten.ebene === 1) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "srp-aktion-btn srp-aktion-btn--primaer";
        btn.textContent = "+ Neue Unterkategorie (Ebene 2)";
        btn.addEventListener("click", () => srpNeueUnterkategorieAnlegen(knoten));
        leiste.appendChild(btn);
      }
      if (knoten.ebene >= 2) {
        const umbenennenBtn = document.createElement("button");
        umbenennenBtn.type = "button";
        umbenennenBtn.className = "srp-aktion-btn";
        umbenennenBtn.textContent = "Umbenennen";
        umbenennenBtn.addEventListener("click", () => srpKnotenUmbenennen(knoten));
        leiste.appendChild(umbenennenBtn);

        const loeschenBtn = document.createElement("button");
        loeschenBtn.type = "button";
        loeschenBtn.className = "srp-aktion-btn srp-aktion-btn--gefahr";
        loeschenBtn.textContent = "Löschen";
        loeschenBtn.addEventListener("click", () => srpKnotenLoeschen(knoten));
        leiste.appendChild(loeschenBtn);
      }
    }

    return leiste;
  }

  function srpNeuesItemAnlegen(elternKnoten) {
    const name = prompt("Name des neuen Items (Ebene " + (elternKnoten.ebene + 1) + "):");
    if (!name) return;
    const kind = {
      id: "n_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      name: name,
      ebene: elternKnoten.ebene + 1,
      kinder: [],
      eintrag: null,
      neu: true,
      angelegtVon: srpRolle,
      angelegtAm: new Date().toISOString().slice(0, 10)
    };
    elternKnoten.kinder.push(kind);
    srpAufgeklappt.add(elternKnoten.id);
    srpAusgewaehlteId = kind.id;
    srpDatenSpeichern();
    srpBaumRendern();
  }

  function srpNeueUnterkategorieAnlegen(kategorieKnoten) {
    const name = prompt("Name der neuen Unterkategorie (Ebene 2) unter \"" + kategorieKnoten.name + "\":");
    if (!name) return;
    const kind = {
      id: "n_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      name: name,
      ebene: 2,
      kinder: [],
      eintrag: null
    };
    kategorieKnoten.kinder.push(kind);
    srpAufgeklappt.add(kategorieKnoten.id);
    srpAusgewaehlteId = kind.id;
    srpDatenSpeichern();
    srpBaumRendern();
  }

  function srpKnotenUmbenennen(knoten) {
    const name = prompt("Neuer Name:", knoten.name);
    if (!name) return;
    knoten.name = name;
    srpDatenSpeichern();
    srpBaumRendern();
  }

  // Liefert den Elternknoten von zielId (rekursiv), oder null, wenn zielId
  // ein Top-Level-Knoten (Ebene 1, kein Elternteil) ist.
  function srpElternKnotenFinden(zielId, liste, elternKandidat) {
    liste = liste || holeBaumDaten().kinder;
    for (let i = 0; i < liste.length; i++) {
      if (liste[i].id === zielId) return elternKandidat;
      if (liste[i].kinder && liste[i].kinder.length) {
        const gefunden = srpElternKnotenFinden(zielId, liste[i].kinder, liste[i]);
        if (gefunden !== undefined) return gefunden;
      }
    }
    return undefined;
  }

  function srpKnotenLoeschen(knoten) {
    if (!confirm('"' + knoten.name + '" inkl. aller Unterpunkte löschen?')) return;
    const eltern = srpElternKnotenFinden(knoten.id, holeBaumDaten().kinder, null);
    const liste = eltern ? eltern.kinder : holeBaumDaten().kinder;
    const index = liste.indexOf(knoten);
    if (index > -1) liste.splice(index, 1);
    srpAusgewaehlteId = eltern ? eltern.id : null;
    srpDatenSpeichern();
    srpBaumRendern();
  }

  // 2.4: Breadcrumb-Pfadanzeige im Panel-Kopf. Alle Stufen ausser der
  // letzten (= der aktuell angezeigte Knoten) sind anklickbar und springen
  // zu diesem Knoten (springt+markiert+scrollt im Baum, siehe
  // srpZuKnotenSpringen).
  function srpBreadcrumbBauen(knoten) {
    const pfad = srpPfadKarte.get(knoten.id) || [knoten];
    const nav = document.createElement("div");
    nav.className = "srp-breadcrumb";
    pfad.forEach((stufe, index) => {
      if (index > 0) {
        const trenner = document.createElement("span");
        trenner.className = "srp-breadcrumb-trenner";
        trenner.textContent = "›";
        nav.appendChild(trenner);
      }
      if (index === pfad.length - 1) {
        const aktuell = document.createElement("span");
        aktuell.className = "srp-breadcrumb-aktuell";
        aktuell.textContent = stufe.name;
        nav.appendChild(aktuell);
      } else {
        const link = document.createElement("button");
        link.type = "button";
        link.className = "srp-breadcrumb-link";
        link.textContent = stufe.name;
        link.addEventListener("click", () => srpZuKnotenSpringen(stufe.id));
        nav.appendChild(link);
      }
    });
    return nav;
  }

  function srpFormularKopfBauen(knoten) {
    const kopf = document.createElement("div");
    kopf.className = "srp-formular-kopf";

    const textBereich = document.createElement("div");
    textBereich.style.minWidth = "0";
    textBereich.appendChild(srpBreadcrumbBauen(knoten));
    const name = document.createElement("div");
    name.className = "srp-formular-name";
    name.textContent = knoten.name;
    const ebene = document.createElement("div");
    ebene.className = "srp-formular-ebene";
    ebene.textContent = "Ebene " + knoten.ebene + " · " + SRP_EBENEN_NAME[knoten.ebene];
    textBereich.appendChild(name);
    textBereich.appendChild(ebene);
    kopf.appendChild(textBereich);

    const schliessenBtn = document.createElement("button");
    schliessenBtn.type = "button";
    schliessenBtn.className = "srp-formular-schliessen";
    schliessenBtn.setAttribute("aria-label", "Panel schließen");
    schliessenBtn.textContent = "×";
    schliessenBtn.addEventListener("click", srpKnotenAbwaehlen);
    kopf.appendChild(schliessenBtn);

    return kopf;
  }

  // Fall 1: Knoten ohne Kinder = tiefster befuellter Punkt -> Bewertungsformular.
  function srpEintragSicherstellen(knoten) {
    if (!knoten.eintrag) {
      knoten.eintrag = { risiko: "grau", begruendung: "", massnahme: "", tracking: { durchgefuehrt: false, datum: "" }, restrisiko: "" };
    }
    return knoten.eintrag;
  }

  function srpBewertungsformularBauen(knoten) {
    const b = knoten.eintrag;
    const container = document.createElement("div");
    container.appendChild(srpFormularKopfBauen(knoten));
    container.appendChild(srpAktionsleisteBauen(knoten));

    if (knoten.neu) {
      const neuHinweis = document.createElement("div");
      neuHinweis.className = "srp-baustein3-hinweis";
      neuHinweis.innerHTML = '<span class="srp-neu-badge">neu</span> Von ' +
        (knoten.angelegtVon || "Nutzer") + " angelegt am " + srpDatumDeutsch(knoten.angelegtAm || "") + ".";
      container.appendChild(neuHinweis);
    }

    const risikoFeld = document.createElement("div");
    risikoFeld.className = "srp-feld";
    const risikoLabel = document.createElement("label");
    risikoLabel.textContent = "Risikostatus";
    const risikoSelect = document.createElement("select");
    ["grau", "gruen", "gelb", "rot"].forEach((wert) => {
      const option = document.createElement("option");
      option.value = wert;
      option.textContent = SRP_LABEL[wert];
      if ((b && b.risiko) === wert || (!b && wert === "grau")) option.selected = true;
      risikoSelect.appendChild(option);
    });
    risikoFeld.appendChild(risikoLabel);
    risikoFeld.appendChild(risikoSelect);
    container.appendChild(risikoFeld);

    const begruendungFeld = document.createElement("div");
    begruendungFeld.className = "srp-feld";
    const begruendungLabel = document.createElement("label");
    begruendungLabel.textContent = "Begründung";
    const begruendungText = document.createElement("textarea");
    begruendungText.value = (b && b.begruendung) || "";
    begruendungText.placeholder = "Warum diese Risikoeinschätzung?";
    begruendungFeld.appendChild(begruendungLabel);
    begruendungFeld.appendChild(begruendungText);
    container.appendChild(begruendungFeld);

    const massnahmeFeld = document.createElement("div");
    massnahmeFeld.className = "srp-feld";
    const massnahmeLabel = document.createElement("label");
    massnahmeLabel.textContent = "Maßnahme";
    const massnahmeText = document.createElement("textarea");
    massnahmeText.value = (b && b.massnahme) || "";
    massnahmeText.placeholder = "Welche Maßnahme ist vorgesehen?";
    massnahmeFeld.appendChild(massnahmeLabel);
    massnahmeFeld.appendChild(massnahmeText);
    container.appendChild(massnahmeFeld);

    const trackingFeld = document.createElement("div");
    trackingFeld.className = "srp-feld";
    const trackingLabel = document.createElement("label");
    trackingLabel.textContent = "Tracking";
    const trackingInline = document.createElement("div");
    trackingInline.className = "srp-feld-inline";
    const durchgefuehrtCheckbox = document.createElement("input");
    durchgefuehrtCheckbox.type = "checkbox";
    durchgefuehrtCheckbox.id = "srp-tracking-durchgefuehrt";
    durchgefuehrtCheckbox.checked = Boolean(b && b.tracking && b.tracking.durchgefuehrt);
    const durchgefuehrtLabel = document.createElement("label");
    durchgefuehrtLabel.htmlFor = "srp-tracking-durchgefuehrt";
    durchgefuehrtLabel.style.marginBottom = "0";
    durchgefuehrtLabel.textContent = "Maßnahme durchgeführt";
    // Bewusst ein Textfeld statt <input type="date">: der native Datepicker
    // richtet sich nach der Systemsprache des Betrachters, nicht nach der
    // Seite (lang="de" auf dem Element hat darauf keinen zuverlaessigen
    // Einfluss) — damit wuerde das Datum je nach Rechner z. B. als
    // mm/dd/yyyy erscheinen. Ein Textfeld mit erzwungenem TT.MM.JJJJ ist
    // fuer diesen Klickmodell-Entwurf verlaesslicher; echte Validierung
    // folgt ohnehin erst in Baustein 3.
    const datumInput = document.createElement("input");
    datumInput.type = "text";
    datumInput.className = "srp-datum-feld";
    datumInput.placeholder = "TT.MM.JJJJ";
    datumInput.value = srpDatumDeutsch((b && b.tracking && b.tracking.datum) || "");
    trackingInline.appendChild(durchgefuehrtCheckbox);
    trackingInline.appendChild(durchgefuehrtLabel);
    trackingFeld.appendChild(trackingLabel);
    trackingFeld.appendChild(trackingInline);
    trackingFeld.appendChild(datumInput);
    container.appendChild(trackingFeld);

    const restrisikoFeld = document.createElement("div");
    restrisikoFeld.className = "srp-feld";
    const restrisikoLabel = document.createElement("label");
    restrisikoLabel.textContent = "Restrisiko nach Maßnahme";
    const restrisikoSelect = document.createElement("select");
    const nochNichtOption = document.createElement("option");
    nochNichtOption.value = "";
    nochNichtOption.textContent = "Noch nicht bewertet";
    restrisikoSelect.appendChild(nochNichtOption);
    ["grau", "gruen", "gelb", "rot"].forEach((wert) => {
      const option = document.createElement("option");
      option.value = wert;
      option.textContent = SRP_LABEL[wert];
      if (b && b.restrisiko === wert) option.selected = true;
      restrisikoSelect.appendChild(option);
    });
    restrisikoFeld.appendChild(restrisikoLabel);
    restrisikoFeld.appendChild(restrisikoSelect);
    container.appendChild(restrisikoFeld);

    // B2: "vorher/nachher sichtbar, Unterscheidung zwischen individuellem
    // und residualem/Rest-Risiko" — sobald ein Restrisiko gesetzt ist, wird
    // der Vergleich zur eigenen (individuellen) Bewertung eingeblendet.
    const vergleichSlot = document.createElement("div");
    vergleichSlot.className = "srp-risiko-vergleich";
    container.appendChild(vergleichSlot);

    function vergleichAktualisieren() {
      const eigen = risikoSelect.value;
      const rest = restrisikoSelect.value;
      if (!rest) { vergleichSlot.innerHTML = ""; return; }
      vergleichSlot.innerHTML = "";
      const vorherLabel = document.createElement("span");
      vorherLabel.className = "srp-risiko-vergleich-label";
      vorherLabel.textContent = "Vorher (individuell):";
      const nachherLabel = document.createElement("span");
      nachherLabel.className = "srp-risiko-vergleich-label";
      nachherLabel.textContent = "Nachher (Restrisiko):";
      vergleichSlot.appendChild(vorherLabel);
      vergleichSlot.appendChild(srpGefuellterChipBauen(eigen));
      vergleichSlot.appendChild(nachherLabel);
      vergleichSlot.appendChild(srpGefuellterChipBauen(rest));
    }
    vergleichAktualisieren();

    const gespeichertHinweis = document.createElement("span");
    gespeichertHinweis.className = "srp-gespeichert-hinweis";
    container.appendChild(gespeichertHinweis);
    let gespeichertTimeout = null;
    function alsGespeichertMarkieren() {
      gespeichertHinweis.textContent = "Gespeichert.";
      clearTimeout(gespeichertTimeout);
      gespeichertTimeout = setTimeout(() => { gespeichertHinweis.textContent = ""; }, 1500);
    }

    // Auto-Save: jede Feldaenderung schreibt sofort in den Knoten und nach
    // localStorage. Der Baum wird bei jeder Aenderung neu gerendert (Status-
    // Chip/Zaehler/Verdichtung muessen aktuell bleiben); das Formular selbst
    // bleibt beim Tippen unangetastet, damit der Fokus im Textfeld erhalten
    // bleibt.
    risikoSelect.addEventListener("change", () => {
      srpEintragSicherstellen(knoten).risiko = risikoSelect.value;
      srpDatenSpeichern();
      alsGespeichertMarkieren();
      vergleichAktualisieren();
      srpBaumRendern();
    });
    begruendungText.addEventListener("input", () => {
      srpEintragSicherstellen(knoten).begruendung = begruendungText.value;
      srpDatenSpeichern();
      alsGespeichertMarkieren();
    });
    massnahmeText.addEventListener("input", () => {
      srpEintragSicherstellen(knoten).massnahme = massnahmeText.value;
      srpDatenSpeichern();
      alsGespeichertMarkieren();
    });
    durchgefuehrtCheckbox.addEventListener("change", () => {
      srpEintragSicherstellen(knoten).tracking.durchgefuehrt = durchgefuehrtCheckbox.checked;
      srpDatenSpeichern();
      alsGespeichertMarkieren();
    });
    datumInput.addEventListener("input", () => {
      // TT.MM.JJJJ -> ISO (YYYY-MM-DD) fuer die Speicherung; ungueltige/
      // unvollstaendige Eingaben werden nicht umgewandelt (bleiben im Feld
      // stehen, aber nicht gespeichert) — echte Validierung folgt spaeter.
      const teile = datumInput.value.split(".");
      if (teile.length === 3 && teile[2].length === 4) {
        const iso = teile[2] + "-" + teile[1].padStart(2, "0") + "-" + teile[0].padStart(2, "0");
        srpEintragSicherstellen(knoten).tracking.datum = iso;
        srpDatenSpeichern();
        alsGespeichertMarkieren();
      }
    });
    restrisikoSelect.addEventListener("change", () => {
      srpEintragSicherstellen(knoten).restrisiko = restrisikoSelect.value;
      srpDatenSpeichern();
      alsGespeichertMarkieren();
      vergleichAktualisieren();
      srpBaumRendern();
    });

    return container;
  }

  // Sammelt alle Nachkommen (nicht den Knoten selbst) mit eigener
  // rot/gelb-Bewertung im gesamten Teilbaum, schlechtesten Status zuerst.
  function srpKritischeEintraegeSammeln(knoten) {
    const ergebnisse = [];
    function rekursiv(k) {
      if (k.eintrag && (k.eintrag.risiko === "rot" || k.eintrag.risiko === "gelb")) {
        ergebnisse.push(k);
      }
      (k.kinder || []).forEach(rekursiv);
    }
    (knoten.kinder || []).forEach(rekursiv);
    ergebnisse.sort((a, b) => SRP_PRIORITAET[b.eintrag.risiko] - SRP_PRIORITAET[a.eintrag.risiko]);
    return ergebnisse;
  }

  // Fall 2: Knoten mit Kindern -> keine Bewertung, sondern Uebersicht.
  function srpUebersichtBauen(knoten) {
    const container = document.createElement("div");
    container.appendChild(srpFormularKopfBauen(knoten));
    container.appendChild(srpAktionsleisteBauen(knoten));

    if (knoten.neu) {
      const neuHinweis = document.createElement("div");
      neuHinweis.className = "srp-baustein3-hinweis";
      neuHinweis.innerHTML = '<span class="srp-neu-badge">neu</span> Von ' +
        (knoten.angelegtVon || "Nutzer") + " angelegt am " + srpDatumDeutsch(knoten.angelegtAm || "") + ".";
      container.appendChild(neuHinweis);
    }

    const hinweis = document.createElement("div");
    hinweis.className = "srp-baustein3-hinweis";
    hinweis.textContent =
      "Die Risikobewertung erfolgt am tiefsten befüllten Punkt eines Pfads " +
      "— dieser Knoten selbst hat kein eigenes Bewertungsformular.";
    container.appendChild(hinweis);

    const statusZeile = document.createElement("div");
    statusZeile.style.marginBottom = "1rem";
    statusZeile.appendChild(srpStatusGruppeBauen(knoten, true));
    container.appendChild(statusZeile);

    const listeLabel = document.createElement("div");
    listeLabel.className = "srp-formular-ebene";
    listeLabel.style.marginBottom = "0.4rem";
    listeLabel.textContent = "Untergeordnete Einträge:";
    container.appendChild(listeLabel);

    (knoten.kinder || []).forEach((kind) => {
      const zeile = document.createElement("div");
      zeile.className = "srp-uebersicht-zeile";
      const kindHatKinder = kind.kinder && kind.kinder.length > 0;
      const nameEl = document.createElement("span");
      nameEl.className = "srp-uebersicht-name";
      nameEl.textContent = kind.name;
      zeile.appendChild(nameEl);
      zeile.appendChild(srpStatusGruppeBauen(kind, kindHatKinder));
      container.appendChild(zeile);
    });

    // 2.4: Kritische Eintraege — sonst sieht man am Zaehler zwar "1 rot",
    // aber nicht, WELCHER Eintrag im Teilbaum das ist.
    const kritischeLabel = document.createElement("div");
    kritischeLabel.className = "srp-formular-ebene";
    kritischeLabel.style.marginTop = "1.25rem";
    kritischeLabel.style.marginBottom = "0.4rem";
    kritischeLabel.textContent = "Kritische Einträge (Rot/Gelb im gesamten Teilbaum):";
    container.appendChild(kritischeLabel);

    const kritische = srpKritischeEintraegeSammeln(knoten);
    if (kritische.length === 0) {
      const keineHinweis = document.createElement("div");
      keineHinweis.className = "srp-platzhalter";
      keineHinweis.textContent = "Keine kritischen Einträge im Teilbaum.";
      container.appendChild(keineHinweis);
    } else {
      kritische.forEach((treffer) => {
        const zeile = document.createElement("div");
        zeile.className = "srp-uebersicht-zeile srp-uebersicht-zeile--klickbar";
        zeile.tabIndex = 0;

        const textBereich = document.createElement("span");
        textBereich.className = "srp-uebersicht-name";
        const nameEl = document.createElement("div");
        nameEl.textContent = treffer.name;
        const pfadOhneSelbst = (srpPfadKarte.get(treffer.id) || [])
          .slice(0, -1)
          .map((k) => k.name)
          .join(" › ");
        const pfadEl = document.createElement("div");
        pfadEl.className = "srp-uebersicht-pfad";
        pfadEl.textContent = pfadOhneSelbst;
        textBereich.appendChild(nameEl);
        textBereich.appendChild(pfadEl);

        zeile.appendChild(textBereich);
        zeile.appendChild(srpGefuellterChipBauen(treffer.eintrag.risiko));
        zeile.addEventListener("click", () => srpZuKnotenSpringen(treffer.id));
        container.appendChild(zeile);
      });
    }

    return container;
  }

  function srpLeerzustandBauen() {
    const hinweis = document.createElement("div");
    hinweis.className = "srp-platzhalter";
    hinweis.textContent =
      "Wähle einen Knoten im Baum aus, um seine Bewertung oder Übersicht hier zu sehen.";
    return hinweis;
  }

  function srpPanelRendern() {
    const adminTabsEl = document.getElementById("srp-admin-tabs");
    adminTabsEl.hidden = srpRolle !== "admin";
    adminTabsEl.querySelectorAll(".srp-admin-tab").forEach((btn) => {
      btn.classList.toggle("srp-admin-tab--aktiv", btn.dataset.tab === srpAdminTab);
    });

    const inhalt = document.getElementById("srp-panel-inhalt");
    inhalt.innerHTML = "";

    if (srpRolle === "admin" && srpAdminTab === "neu") {
      inhalt.appendChild(srpAdminNeueItemsBauen());
      return;
    }

    if (!srpAusgewaehlteId) {
      inhalt.appendChild(srpLeerzustandBauen());
      return;
    }

    const knoten = srpKnotenKarte.get(srpAusgewaehlteId);
    const hatKinder = knoten.kinder && knoten.kinder.length > 0;
    inhalt.appendChild(hatKinder ? srpUebersichtBauen(knoten) : srpBewertungsformularBauen(knoten));
  }

  function srpKnotenAuswaehlen(id) {
    srpAusgewaehlteId = id;
    srpBaumRendern();
  }

  function srpKnotenAbwaehlen() {
    srpAusgewaehlteId = null;
    srpBaumRendern();
  }

  // 2.4: Pfadanzeige/kritische Eintraege springen hierueber zu einem
  // Knoten — klappt seine Vorfahren auf (falls noch zu), waehlt ihn aus
  // und scrollt ihn in den sichtbaren Bereich.
  function srpZuKnotenSpringen(zielId) {
    const pfad = srpPfadKarte.get(zielId) || [];
    pfad.forEach((stufe) => {
      if (stufe.id !== zielId && stufe.kinder && stufe.kinder.length > 0) {
        srpAufgeklappt.add(stufe.id);
      }
    });
    srpAusgewaehlteId = zielId;
    srpBaumRendern();
    const zeile = document.querySelector('.srp-knoten-zeile[data-id="' + zielId + '"]');
    if (zeile) {
      zeile.scrollIntoView({ block: "center" });
    }
  }

  document.addEventListener("keydown", (ereignis) => {
    if (ereignis.key === "Escape" && srpAusgewaehlteId) {
      srpKnotenAbwaehlen();
    }
  });

  function srpKnotenElementBauen(knoten) {
    const li = document.createElement("li");
    li.className = "srp-knoten";

    const istAktiv = srpIstSuchOderFilterAktiv();

    const zeile = document.createElement("div");
    zeile.className = "srp-knoten-zeile";
    zeile.dataset.id = knoten.id;
    if (knoten.id === srpAusgewaehlteId) {
      zeile.classList.add("srp-ausgewaehlt");
    }
    if (istAktiv && srpAktiveFilter.size > 0 && !srpKnotenMatchtFilter(knoten)) {
      zeile.classList.add("srp-ausgegraut");
    }

    const hatKinder = knoten.kinder && knoten.kinder.length > 0;
    const sichtbareKinder = (knoten.kinder || []).filter(
      (kind) => !istAktiv || srpSichtbarkeitsKarte.get(kind.id)
    );
    const effektivOffen = hatKinder && (srpAufgeklappt.has(knoten.id) || (istAktiv && sichtbareKinder.length > 0));

    let toggleBtn = null;
    let kinderListe = null;

    if (hatKinder) {
      toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "srp-toggle";
      toggleBtn.setAttribute("aria-label", "Ein-/Ausklappen: " + knoten.name);
      zeile.appendChild(toggleBtn);
    } else {
      const spacer = document.createElement("span");
      spacer.className = "srp-toggle-platzhalter";
      zeile.appendChild(spacer);
    }

    // label selbst ist das Flex-Item (bestimmt Umbruchverhalten und nimmt
    // die volle verbleibende Zeilenbreite ein); die Hervorhebung sitzt auf
    // einem inneren, nicht wachsenden Span, damit sie nur den Namenstext
    // einfaerbt und nicht die ganze Zeilenbreite.
    const label = document.createElement("span");
    label.className = "srp-knoten-label srp-knoten-e" + knoten.ebene;
    const labelText = document.createElement("span");
    labelText.textContent = knoten.name;
    if (istAktiv && srpSuchNorm() && srpKnotenMatchtSuche(knoten)) {
      labelText.classList.add("srp-knoten-label--treffer");
    }
    label.appendChild(labelText);
    if (knoten.neu) {
      const neuBadge = document.createElement("span");
      neuBadge.className = "srp-neu-badge";
      neuBadge.textContent = "neu";
      label.appendChild(neuBadge);
    }
    zeile.appendChild(label);

    zeile.appendChild(srpStatusGruppeBauen(knoten, hatKinder));

    li.appendChild(zeile);

    if (hatKinder) {
      kinderListe = document.createElement("ul");
      kinderListe.className = "srp-kinder srp-baum-liste";
      sichtbareKinder.forEach((kind) => {
        kinderListe.appendChild(srpKnotenElementBauen(kind));
      });
      kinderListe.hidden = !effektivOffen;
      toggleBtn.textContent = effektivOffen ? "▾" : "▸";
      toggleBtn.setAttribute("aria-expanded", String(effektivOffen));
      li.appendChild(kinderListe);

      toggleBtn.addEventListener("click", (ereignis) => {
        ereignis.stopPropagation();
        if (srpAufgeklappt.has(knoten.id)) {
          srpAufgeklappt.delete(knoten.id);
        } else {
          srpAufgeklappt.add(knoten.id);
        }
        srpBaumRendern();
      });
    }

    // Klick auf den Knoten selbst waehlt ihn aus und oeffnet ihn im
    // Formular-Panel rechts. Veraendert bewusst NICHT den Auf-/Zuklapp-
    // Zustand irgendeines Knotens.
    zeile.addEventListener("click", () => {
      srpKnotenAuswaehlen(knoten.id);
    });

    return li;
  }

  function srpBaumRendern() {
    srpKartenAufbauen();
    srpSichtbarkeitBerechnen();
    srpSucheUiAktualisieren();

    const wurzel = holeBaumDaten();
    const istAktiv = srpIstSuchOderFilterAktiv();
    const container = document.getElementById("srp-baum");
    container.innerHTML = "";

    if (istAktiv && srpTrefferAnzahl === 0) {
      container.appendChild(srpKeineTrefferBauen());
    } else {
      const liste = document.createElement("ul");
      liste.className = "srp-baum-liste";
      const sichtbareKategorien = wurzel.kinder.filter(
        (k) => !istAktiv || srpSichtbarkeitsKarte.get(k.id)
      );
      sichtbareKategorien.forEach((knoten) => {
        liste.appendChild(srpKnotenElementBauen(knoten));
      });
      container.appendChild(liste);
    }

    srpPanelRendern();
    srpUeberlagerungAktualisieren();
  }

  // ---- Karten (Knoten/Pfad/Statistik) vor jedem Rendern frisch aufbauen,
  // da sich die Struktur durch Neue-Item/Umbenennen/Loeschen-Aktionen und
  // Bewertungsaenderungen zur Laufzeit aendert (kleine Baumgroesse macht
  // das unproblematisch). Der Auf-/Zuklapp-Zustand (srpAufgeklappt) bleibt
  // davon unberuehrt — der wird nur einmalig beim Laden vorbelegt. ----

  function srpKartenAufbauen() {
    srpKnotenKarte.clear();
    srpPfadKarte.clear();
    srpStatistikKarte.clear();
    const wurzel = holeBaumDaten();
    wurzel.kinder.forEach((knoten) => {
      srpStatistikBerechnen(knoten);
      srpKnotenKarteBauen(knoten, []);
    });
  }

  document.getElementById("srp-suchfeld").addEventListener("input", (ereignis) => {
    srpSuchbegriff = ereignis.target.value;
    srpBaumRendern();
  });

  document.getElementById("srp-suche-zuruecksetzen").addEventListener("click", () => {
    srpSuchbegriff = "";
    document.getElementById("srp-suchfeld").value = "";
    srpBaumRendern();
    document.getElementById("srp-suchfeld").focus();
  });

  document.querySelectorAll(".srp-filter-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const status = chip.dataset.status;
      if (srpAktiveFilter.has(status)) {
        srpAktiveFilter.delete(status);
      } else {
        srpAktiveFilter.add(status);
      }
      srpBaumRendern();
    });
  });

  document.getElementById("srp-filter-zuruecksetzen").addEventListener("click", () => {
    srpAktiveFilter.clear();
    srpBaumRendern();
  });

  // ============================================================
  // Admin: Übersicht "Neue Nutzer-Items" (fachbereichsbezogen filterbar).
  // Fachbereich = Name der Ebene-1-Kategorie, aus dem Pfad des Knotens.
  // ============================================================
  function srpNeueItemsSammeln(liste, out) {
    liste = liste || holeBaumDaten().kinder;
    out = out || [];
    liste.forEach((knoten) => {
      if (knoten.neu) out.push(knoten);
      if (knoten.kinder && knoten.kinder.length) srpNeueItemsSammeln(knoten.kinder, out);
    });
    return out;
  }

  function srpFachbereichVonKnoten(knoten) {
    const pfad = srpPfadKarte.get(knoten.id);
    return pfad && pfad[0] ? pfad[0].name : "";
  }

  function srpAdminFachbereichSelectBefuellen() {
    const sel = document.getElementById("srp-admin-fachbereich-select");
    const vorherigerWert = sel.value || srpAdminFachbereich;
    sel.innerHTML = "";
    const alleOption = document.createElement("option");
    alleOption.value = "alle";
    alleOption.textContent = "Alle Fachbereiche";
    sel.appendChild(alleOption);
    holeBaumDaten().kinder.forEach((kategorie) => {
      const option = document.createElement("option");
      option.value = kategorie.name;
      option.textContent = kategorie.name;
      sel.appendChild(option);
    });
    sel.value = vorherigerWert;
    if (sel.value !== vorherigerWert) sel.value = "alle";
    srpAdminFachbereich = sel.value;
  }

  function srpAdminNeueItemsBauen() {
    const container = document.createElement("div");
    const titel = document.createElement("h3");
    titel.className = "srp-formular-name";
    titel.textContent = "Neu angelegte Nutzer-Items";
    container.appendChild(titel);

    let items = srpNeueItemsSammeln();
    if (srpAdminFachbereich !== "alle") {
      items = items.filter((n) => srpFachbereichVonKnoten(n) === srpAdminFachbereich);
    }

    if (!items.length) {
      const leer = document.createElement("div");
      leer.className = "srp-platzhalter";
      leer.textContent = "Für den gewählten Fachbereich wurden aktuell keine neuen Punkte durch Nutzer:innen angelegt.";
      container.appendChild(leer);
    } else {
      items.forEach((knoten) => {
        const pfad = (srpPfadKarte.get(knoten.id) || []).map((k) => k.name).join(" › ");
        const zeile = document.createElement("div");
        zeile.className = "srp-uebersicht-zeile srp-uebersicht-zeile--klickbar";
        zeile.tabIndex = 0;

        const textBereich = document.createElement("span");
        textBereich.className = "srp-uebersicht-name";
        const nameEl = document.createElement("div");
        nameEl.innerHTML = '<span class="srp-neu-badge">neu</span> ' + knoten.name;
        const pfadEl = document.createElement("div");
        pfadEl.className = "srp-uebersicht-pfad";
        pfadEl.textContent = pfad + " · angelegt von " + (knoten.angelegtVon || "Nutzer") +
          " am " + srpDatumDeutsch(knoten.angelegtAm || "");
        textBereich.appendChild(nameEl);
        textBereich.appendChild(pfadEl);
        zeile.appendChild(textBereich);

        if (knoten.eintrag && knoten.eintrag.risiko) {
          zeile.appendChild(srpGefuellterChipBauen(knoten.eintrag.risiko));
        }

        zeile.addEventListener("click", () => {
          srpAdminTab = "struktur";
          srpZuKnotenSpringen(knoten.id);
        });
        container.appendChild(zeile);
      });
    }

    const hinweis = document.createElement("p");
    hinweis.className = "srp-platzhalter";
    hinweis.style.marginTop = "1rem";
    hinweis.textContent = "Hinweis: Neue Items werden ohne Prüfung direkt übernommen. Diese Übersicht dient der Governance-Sichtbarkeit, nicht einer Freigabe.";
    container.appendChild(hinweis);

    return container;
  }

  // ============================================================
  // Rolle: UI-Sichtbarkeit umschalten (Admin-Fachbereich-Auswahl,
  // Admin-Tabs) — kein produktionsreifes Rechtesystem.
  // ============================================================
  function srpRolleAnwenden() {
    document.getElementById("srp-admin-fachbereich-wrap").hidden = srpRolle !== "admin";
    if (srpRolle === "admin") srpAdminFachbereichSelectBefuellen();
    srpBaumRendern();
  }

  document.getElementById("srp-rolle-select").addEventListener("change", (ereignis) => {
    srpRolle = ereignis.target.value;
    srpRolleAnwenden();
  });

  document.getElementById("srp-admin-fachbereich-select").addEventListener("change", (ereignis) => {
    srpAdminFachbereich = ereignis.target.value;
    srpBaumRendern();
  });

  document.getElementById("srp-admin-tabs").addEventListener("click", (ereignis) => {
    const btn = ereignis.target.closest(".srp-admin-tab");
    if (!btn) return;
    srpAdminTab = btn.dataset.tab;
    srpBaumRendern();
  });

  document.getElementById("srp-reset-btn").addEventListener("click", () => {
    if (confirm("Alle lokalen Änderungen verwerfen und Demo-Daten neu laden?")) srpDemoZuruecksetzen();
  });

  // ============================================================
  // AP5: Szenario-Erklärung (Banner + Modal), Kurzeinstieg.
  // Eigenständige Komponenten, inhaltlich unabhängig vom Rollensystem.
  // ============================================================
  const SRP_BANNER_KEY = "srp_szenario_banner_ausgeblendet_v1";
  const SRP_KURZEINSTIEG_KEY = "srp_kurzeinstieg_ausgeblendet_v1";

  function srpBannerAusgeblendet() {
    try { return localStorage.getItem(SRP_BANNER_KEY) === "1"; } catch (e) { return false; }
  }
  function srpBannerAusblendenSetzen(wert) {
    try { localStorage.setItem(SRP_BANNER_KEY, wert ? "1" : "0"); } catch (e) { /* n/a */ }
  }

  function srpSzenarioBannerRendern() {
    const slot = document.getElementById("srp-szenario-banner-slot");
    if (srpBannerAusgeblendet()) { slot.innerHTML = ""; return; }
    slot.innerHTML =
      '<div class="srp-banner" role="note">' +
        '<button type="button" class="srp-banner-schliessen" aria-label="Hinweis schließen">&times;</button>' +
        '<h2 style="text-transform:none;letter-spacing:normal;color:var(--srp-text);font-size:0.95rem;margin:0 0 0.4rem;">Worum geht es in diesem Tool?</h2>' +
        '<p style="margin:0 0 0.6rem;font-size:0.85rem;">Dieses Tool bereitet den Flughafenbetrieb systematisch auf ' +
        'Extremhitze-Szenarien vor (z. B. ab 40 °C Außentemperatur). Fachbereiche bewerten ihr Risiko nach der ' +
        'Ampel-Skala und hinterlegen Maßnahmen – so ist im Ernstfall vorbereitet, wer sonst überrascht reagieren müsste.</p>' +
        '<button type="button" class="srp-aktion-btn" id="srp-banner-mehr-btn">Mehr erfahren</button>' +
      '</div>';
    slot.querySelector(".srp-banner-schliessen").addEventListener("click", () => {
      srpBannerAusblendenSetzen(true);
      srpSzenarioBannerRendern();
    });
    slot.querySelector("#srp-banner-mehr-btn").addEventListener("click", srpSzenarioModalOeffnen);
  }

  function srpSzenarioModalInhaltBauen() {
    const ampelZeilen = ["grau", "gruen", "gelb", "rot"].map((k) =>
      '<div class="srp-legende-zeile"><span class="srp-ampel srp-ampel--' + k + '"><span class="srp-ampel-symbol">' +
      SRP_SYMBOL[k] + '</span> ' + SRP_LABEL[k].split(" – ")[0] + '</span><span class="srp-legende-erklaerung">' +
      SRP_LABEL[k].split(" – ")[1] + '</span></div>'
    ).join("");
    return (
      '<div class="srp-formular-kopf">' +
        '<div><div class="srp-formular-name" id="srp-szenario-modal-titel">Szenario &amp; Vorgehen</div></div>' +
        '<button type="button" class="srp-formular-schliessen" id="srp-szenario-modal-schliessen" aria-label="Schließen">&times;</button>' +
      '</div>' +
      '<h2 style="text-transform:none;letter-spacing:normal;color:var(--srp-text);font-size:0.85rem;">Warum ein 40 °C-Szenario?</h2>' +
      '<p style="font-size:0.85rem;">Extremhitze wirkt auf einen Flughafen gleichzeitig auf mehreren Ebenen: technische ' +
      'Anlagen haben physikalische Belastungsgrenzen, Betriebsabläufe können sich verzögern, und Personal benötigt ' +
      'Schutz vor Hitzebelastung. 40 °C dient hier als beispielhafter Schwellenwert, um diese Belastungsgrenzen ' +
      'konkret durchzuspielen – unabhängig vom tatsächlichen Standort.</p>' +
      '<h2 style="text-transform:none;letter-spacing:normal;color:var(--srp-text);font-size:0.85rem;margin-top:1rem;">Wie wird bewertet?</h2>' +
      '<p style="font-size:0.85rem;">Jeder Strukturpunkt (ab Ebene 2, bis maximal Ebene 5) erhält eine Ampel-Bewertung:</p>' +
      '<div class="srp-legende-liste">' + ampelZeilen + '</div>' +
      '<p style="font-size:0.85rem;margin-top:0.75rem;">Zu Gelb und Rot gehört jeweils eine konkrete Maßnahme. Nach ' +
      'deren Umsetzung wird per <strong>Tracking</strong> festgehalten, ob sie durchgeführt wurde, und anschließend ' +
      'das <strong>Restrisiko</strong> neu bewertet – vorher und nachher bleiben dabei sichtbar.</p>' +
      '<h2 style="text-transform:none;letter-spacing:normal;color:var(--srp-text);font-size:0.85rem;margin-top:1rem;">Aktuelle Phase</h2>' +
      '<p style="font-size:0.85rem;margin-bottom:0;">Das Tool befindet sich in der <strong>Vorbereitungsphase</strong> ' +
      'und ist kein Produktivsystem. Es enthält ausschließlich Beispieldaten – keine echten oder sensiblen Betriebsdaten.</p>'
    );
  }

  function srpSzenarioModalOeffnen() {
    document.getElementById("srp-szenario-modal-inhalt").innerHTML = srpSzenarioModalInhaltBauen();
    const hintergrund = document.getElementById("srp-szenario-modal-hintergrund");
    hintergrund.hidden = false;
    document.getElementById("srp-szenario-modal-schliessen").addEventListener("click", srpSzenarioModalSchliessen);
  }
  function srpSzenarioModalSchliessen() {
    document.getElementById("srp-szenario-modal-hintergrund").hidden = true;
  }
  document.getElementById("srp-szenario-info-btn").addEventListener("click", srpSzenarioModalOeffnen);
  document.getElementById("srp-szenario-modal-hintergrund").addEventListener("click", (ereignis) => {
    if (ereignis.target.id === "srp-szenario-modal-hintergrund") srpSzenarioModalSchliessen();
  });
  document.addEventListener("keydown", (ereignis) => {
    if (ereignis.key === "Escape" && !document.getElementById("srp-szenario-modal-hintergrund").hidden) {
      srpSzenarioModalSchliessen();
    }
  });

  function srpKurzeinstiegAusgeblendet() {
    try { return localStorage.getItem(SRP_KURZEINSTIEG_KEY) === "1"; } catch (e) { return false; }
  }
  function srpKurzeinstiegAusblendenSetzen(wert) {
    try { localStorage.setItem(SRP_KURZEINSTIEG_KEY, wert ? "1" : "0"); } catch (e) { /* n/a */ }
  }

  const SRP_KURZEINSTIEG_SCHRITTE = [
    { titel: "Rolle wählen", text: "Oben rechts festlegen, ob Sie als Nutzer:in, Entwickler:in oder Admin arbeiten – das bestimmt, welche Aktionen verfügbar sind." },
    { titel: "Struktur durchsuchen & bewerten", text: "Passenden Punkt im Baum wählen, Ampel-Status setzen und bei Gelb/Rot eine Maßnahme eintragen." },
    { titel: "Tracking & Restrisiko pflegen", text: "Nach Umsetzung der Maßnahme im Tracking abhaken und anschließend das Restrisiko neu bewerten." }
  ];

  function srpKurzeinstiegRendern() {
    const slot = document.getElementById("srp-kurzeinstieg-slot");
    if (srpKurzeinstiegAusgeblendet()) {
      slot.innerHTML = '<button type="button" class="srp-aktion-btn" id="srp-kurzeinstieg-zeigen-btn">&#8635; Kurzeinstieg wieder anzeigen</button>';
      slot.querySelector("#srp-kurzeinstieg-zeigen-btn").addEventListener("click", () => {
        srpKurzeinstiegAusblendenSetzen(false);
        srpKurzeinstiegRendern();
      });
      return;
    }
    const schritteHtml = SRP_KURZEINSTIEG_SCHRITTE.map((s, i) =>
      '<div class="srp-kurzeinstieg-schritt"><span class="srp-kurzeinstieg-num">' + (i + 1) + '</span>' +
      '<div><div style="font-weight:700;font-size:0.85rem;">' + s.titel + '</div>' +
      '<div style="font-size:0.8rem;color:var(--srp-text-muted);">' + s.text + '</div></div></div>'
    ).join("");
    slot.innerHTML =
      '<div class="srp-kurzeinstieg">' +
        '<h2 style="text-transform:none;letter-spacing:normal;color:var(--srp-text);font-size:0.9rem;margin:0 0 0.75rem;">So starten Sie in 3 Schritten</h2>' +
        '<div class="srp-kurzeinstieg-grid">' + schritteHtml + '</div>' +
        '<div style="text-align:right;margin-top:0.75rem;"><button type="button" class="srp-aktion-btn" id="srp-kurzeinstieg-ausblenden-btn">Verstanden, ausblenden</button></div>' +
      '</div>';
    slot.querySelector("#srp-kurzeinstieg-ausblenden-btn").addEventListener("click", () => {
      srpKurzeinstiegAusblendenSetzen(true);
      srpKurzeinstiegRendern();
    });
  }

  // ---- Init ----
  srpDatenLaden();
  srpDefaultZustandSetzen(holeBaumDaten());
  srpSzenarioBannerRendern();
  srpKurzeinstiegRendern();
  srpRolleAnwenden();
</script>

</body>
</html>
